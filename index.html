<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Backend Target</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #1a202c; margin-bottom: 5px; }
        .subtitle { color: #718096; margin-bottom: 30px; }

        /* The single real-time server box */
        .server-box {
            background: #ffffff;
            border: 2px solid #4a5568;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            width: 320px;
            position: relative;
        }

        /* Dynamic Color Coding based on which host is injected */
        body:has(.host-web-01) .server-box {
            border-color: #3182ce;
            background-color: #ebf8ff; /* Light Blue for Server 1 */
        }
        body:has(.host-web-02) .server-box {
            border-color: #38a169;
            background-color: #f0fff4; /* Light Green for Server 2 */
        }

        .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #718096;
            margin-bottom: 4px;
        }

        .value {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a202c;
        }

        .divider {
            height: 1px;
            background: #e2e8f0;
            margin: 12px 0;
        }
    </style>
</head>
<body>

    <h1>Live Backend Route</h1>
    <p class="subtitle">Real-time upstream metrics from the load balancer</p>

    <div class="server-box">
        <div class="label">Served By Backend</div>
        <!-- Nginx will dynamically swap these out text blocks -->
        <div class="value host-TARGET_HOST">TARGET_HOST</div>
        
        <div class="divider"></div>
        
        <div class="label">Upstream IP & Port</div>
        <div class="value">TARGET_IP</div>
    </div>

</body>
</html>
